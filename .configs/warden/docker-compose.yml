name: warden

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: warden-ts
    hostname: ${WARDEN_HOSTNAME:-warden}
    environment:
      TS_AUTHKEY: ${WARDEN_TS_KEY:?missing WARDEN_TS_KEY}
      TS_HOSTNAME: ${WARDEN_HOSTNAME:-warden}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${WARDEN_DATA:?missing WARDEN_DATA}/ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: warden-app
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      DOMAIN: https://${WARDEN_HOSTNAME:-warden}.${WARDEN_TAILNET:?missing WARDEN_TAILNET}
      ADMIN_TOKEN: ${WARDEN_ADMIN_TOKEN:?missing WARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${WARDEN_SIGNUPS:-false}
      ROCKET_ADDRESS: 127.0.0.1
      ROCKET_PORT: 80
    volumes:
      - ${WARDEN_DATA:?missing WARDEN_DATA}/vw-data:/data
    restart: unless-stopped
